# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=0
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 5
shadows_blur = 10
shadows_position_x = 5
shadows_position_y = 5

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

group_bar_height = 25
group_bar_decorate_border_width = 2
group_bar_decorate_corner_radius = 0
group_bar_decorate_font_desc = nerd Mono 12

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.3
zoom_end_ratio=0.4
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.34, 1.28, 0.64, 1
animation_curve_move=0.25, 1, 0.5, 1.05
animation_curve_tag=0.25, 1, 0.5, 1.05
animation_curve_close=0.34, 1.28, 0.64, 1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=15
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
edge_scroller_pointer_focus=0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=0.997
scroller_proportion_preset=0.5,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Example dwindle configuration
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_hsplit=0
dwindle_vsplit=0
dwindle_preserve_split=0
dwindle_smart_resize=0
dwindle_drop_simple_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=0
allow_tearing=2
syncobj_enable=1
tag_gather=1

# keyboard
repeat_rate=35
repeat_delay=250
numlockon=0
xkb_rules_layout=gb

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=0
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=-0.3

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,space,spawn_shell,noctalia msg panel-toggle launcher
bind=SUPER,Return,spawn,ghostty
bind=SUPER,b,spawn,zen-twilight
bind=SUPER,p,spawn,zen-twilight --private-window
bind=SUPER,e,spawn,dolphin

bind=NONE,XF86AudioPlay,spawn_shell,playerctl play-pause
bind=NONE,XF86AudioNext,spawn_shell,playerctl next
bind=NONE,XF86AudioPrev,spawn_shell,playerctl previous
bind=NONE,XF86AudioRaiseVolume,spawn_shell, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.01+
bind=NONE,XF86AudioLowerVolume,spawn_shell, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.01-
bind=NONE,XF86AudioMute, spawn_shell, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=SUPER,m,spawn_shell,pactl set-source-mute @DEFAULT_SOURCE@ toggle

bind=SUPER+Shift,s,spawn,$HOME/.config/scripts/mangoSS.sh
bind=CTRL+SHIFT,Escape,spawn_shell, ghostty -e btop

bind=SUPER+Shift,e,spawn_shell,ghostty -e yazi
bind=SUPER+CTRL,w,spawn_shell,noctalia msg panel-toggle wallpaper
bind=SUPER,i,spawn_shell,noctalia msg settings-toggle
bind=SUPER+CTRL,q,spawn_shell,noctalia msg panel-toggle session
bind = SUPER,c,tagmon,left,HDMI-A-2,keeptag=1

# exit
bind=SUPER,q,killclient,

# switch window focusnotify-send "test"
bind=SUPER,Tab,focusstack,next
bind=SUPER,a,focusdir,left
bind=SUPER,d,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,a,exchange_client,left
bind=SUPER+SHIFT,d,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,v,toggleoverview,
bind=ALT,backslash,togglefloating,
bind=SUPER,f,switch_proportion_preset,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,

# scroller layout
bind=ALT,e,set_proportion,0.5
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,x,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,z,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=ALT+SUPER,a,tagtoleft,0
bind=ALT+SUPER,d,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=SUPER,s,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule

# Auto Start
exec-once=noctalia
exec-once=steam
exec-once=spotify
exec-once=discord


# Monitors
monitorrule=name:DP-1,width:2560,height:1440,refresh:165,x:0,y:0,vrr:0
monitorrule=name:HDMI-A-2,width:1920,height:1080,refresh:60,x:2560,y:360

windowrule = isfloating:1,width:600,height:450,offsetx:-100,offsety:-100,appid:obsidian
windowrule = monitor:HDMI-A-2,scroller_proportion:0.75,appid:discord
windowrule = monitor:HDMI-A-2,scroller_proportion:0.75,appid:spotify
windowrule = monitor:HDMI-A-2,scroller_proportion:1.0,appid:steam
windowrule = monitor:DP-1,isfullscreen:1,appid:steam_app_*
windowrule = isfloating:1,width:300,height:700,title:^Friends List$

env=QT_QPA_PLATFORMTHEME,qt6ct
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_CURRENT_SESSION_TYPE,wayland
env=SDL_VIDEODRIVER,wayland
env=XDG_DESKTOP_PORTAL,mango


# This sources the noctalia theme

source = /home/ozgur/.config/mango/noctalia.conf




source=~/.config/mango/noctalia.conf
